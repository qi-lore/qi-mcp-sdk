# CI for Principle IX (Git and Review Discipline): FR-037 and FR-038.
#
# Two independent gates run on every pull request, targeting any base branch:
#
#   1. Branch model — a feature branch must target `dev`; the integration
#      branch `dev` must target `main`. Any other combination fails.
#   2. Commit history — every non-merge commit the pull request introduces must
#      be a single-line Conventional Commit. A commit with a body or footer is
#      rejected because Principle IX forbids multi-line commit messages.
#
# The checks are plain shell over `git` rather than a third-party commit-lint
# action: no published action enforces the "single-line only" half, and a
# self-contained script cannot change behaviour underneath a green run.
# `actions/checkout` is pinned to the same exact release as ci.yml.

name: commit-conventions

# No `branches` filter on purpose: the gate has to see a pull request whose base
# branch is wrong (e.g. a feature branch opened against `main`) in order to fail
# it. Filtering to `dev`/`main` would silently skip exactly those cases.
on:
  pull_request:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Full history so `base.sha..head.sha` is reachable for the scan.
          fetch-depth: 0

      - name: Enforce branch model
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" = "dev" ]; then
            expected="main"
          else
            expected="dev"
          fi
          if [ "$BASE_REF" != "$expected" ]; then
            echo "::error::branch model violation: '$HEAD_REF' must target '$expected', not '$BASE_REF' (Principle IX, FR-038)"
            exit 1
          fi
          echo "branch model OK: '$HEAD_REF' -> '$BASE_REF'"

      - name: Enforce Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Type set from @commitlint/config-conventional.
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          header="^(${types})(\([^()]+\))?!?: .+$"

          # Merge commits are generated by git, never authored as Conventional
          # Commits, so they are excluded; every other commit must conform.
          #
          # The count guard runs first so an unresolvable SHA fails the job
          # (under `set -e`) and an empty range fails explicitly, rather than
          # letting the loop below pass vacuously.
          count=$(git rev-list --count --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$count" -eq 0 ]; then
            echo "::error::no commits found between $BASE_SHA and $HEAD_SHA"
            exit 1
          fi

          status=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")
            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error::$sha: commit body present; commits must be single-line (Principle IX)"
              status=1
            fi
            if ! printf '%s' "$subject" | grep -Eq "$header"; then
              echo "::error::$sha: '$subject' is not a Conventional Commit (FR-037)"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          [ "$status" -eq 0 ] || exit 1
          echo "all commits conform to Conventional Commits, single-line only"
